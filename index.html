<!-- B IMPACT, WITH EVIDENCE -->
<section id="impact" style="background: #1F3D2B; color: #FBF4E6">
<div class="wrap" style="padding-top: 96px; padding-bottom: 96px">
<p class="kicker" style="color: #FFD15C">Impact, with evidence</p>
<p class="serif" style="margin: 0; font-size: clamp(30px, 3.8vw, 52px); line-height: 1.22; letter-spacing: -0.015em; max-width: 1100px">
<strong style="color: #FFD15C">52,775</strong> members<sup style="font-size: 0.4em">1</sup> learn with us through <strong style="color: #FFD15C">72</strong> campus communities in 13 districts<sup style="font-size: 0.4em">2</sup>. <strong style="color: #F6C9D0">11,277</strong> people have built at our two TinkerSpaces<sup style="font-size: 0.4em">3</sup>, and <strong style="color: #F6C9D0">2,413</strong> women’s teams shipped <strong style="color: #F6C9D0">1,393</strong> projects at Tink-Her-Hack 4.0<sup style="font-size: 0.4em">4</sup>.</p>
<ol style="margin: 48px 0 0; padding: 24px 0 0; border-top: 1px solid rgba(251,244,230,0.3); list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; font-size: 14px; color: #DDE6DF">
<li><strong style="color: #FBF4E6">1 · Members.</strong> Registered member profiles on TinkerHub’s platform, as of 20 Oct 2026. Registered, not necessarily active.</li>
<li><strong style="color: #FBF4E6">2 · Campuses.</strong> Communities marked active, 20 Oct 2026. None yet in Wayanad.</li>
<li><strong style="color: #FBF4E6">3 · TinkerSpaces.</strong> Unique people checked in at Kochi and Calicut, 29 Apr 2024 – 20 Oct 2026. Earlier Kochi visits aren’t counted.</li>
<li><strong style="color: #FBF4E6">4 · Tink-Her-Hack 4.0.</strong> Teams registered and projects submitted, Feb 2026, across 67 venues.</li>
</ol>
</div>
</section>


<!-- GROWTH -->
<section id="growth" style="background: #FBF4E6">
<div class="wrap g" style="padding-top: 104px; padding-bottom: 96px; align-items: center">
<div class="s5">
<p class="kicker" style="color: #FF7A3D">Growing every year</p>
<h2 class="h2" style="margin-bottom: 20px">Four times as many events as in 2024.</h2>
<p style="margin: 0 0 24px; font-size: 18px">Events run through TinkerHub’s platform rose from 364 in 2024 to 1,506 in 2026 — and the year isn’t over. Our flagship hackathon keeps widening its reach too.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<div style="background: #D9CCF2; border: 2px solid #1F3D2B; border-radius: 22px; padding: 18px"><p style="margin: 0; font-size: 13px; font-weight: 700">Tink-Her-Hack venues</p><p class="serif" style="margin: 4px 0 0; font-size: 30px; font-weight: 700; line-height: 1">63 → 67</p><p style="margin: 6px 0 0; font-size: 13px">3.0 (2025) → 4.0 (2026)</p></div>
<div style="background: #F6C9D0; border: 2px solid #1F3D2B; border-radius: 22px; padding: 18px"><p style="margin: 0; font-size: 13px; font-weight: 700">Projects submitted</p><p class="serif" style="margin: 4px 0 0; font-size: 30px; font-weight: 700; line-height: 1">1,188 → 1,393</p><p style="margin: 6px 0 0; font-size: 13px">+17% year on year</p></div>
</div>
<p style="margin: 18px 0 0; font-size: 13px">Events include all sessions logged on the platform. 2024 counts from April, when tracking began. Source: member platform, 20 Oct 2026.</p>
</div>

<div class="s7"><p class="kicker">How it connects</p><h2 class="h2">Five groups. One learning ecosystem.</h2></div>

      { name: "Thejus Engineering College, Erumapetty", district: 'Thrissur', layer: 'campus', detail: 'Active campus community', source: 'TinkerHub member platform via Metabase · 20 Oct 2026' },
      { name: "Vidya Academy of Science & Technology, Thalakkottukara", district: 'Thrissur', layer: 'campus', detail: 'Active campus community', source: 'TinkerHub member platform via Metabase · 20 Oct 2026' },

      { date: '2025', type: 'Output', text: 'Arduino Day 2025 held at TinkerSpace Kochi (photo on the Calicut campaign page).' },
      { date: 'Mar 2024', type: 'Output', text: 'Women Makers Celebration: mentoring for the top 100 Tink-Her-Hack participants, then a public day at Kerala Startup Mission.' },
      { date: '24 Feb 2024', type: 'Output', text: 'Mastering AI opens with a hands-on LLM deployment workshop at TinkerSpace, on GPUs from E2E Networks.' },
      { date: '24 Feb 2024', type: 'Milestone', text: 'Tink-Her-Hack 2.0 begins across 26 venues — 1,360 planned seats.' },

  }



  chip(on) {
    return 'min-height: 42px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; border: 2px solid #1F3D2B; display: inline-flex; align-items: center; gap: 8px; ' + (on ? 'background: #1F3D2B; color: #FBF4E6' : 'background: transparent; color: #1F3D2B');
  }

  renderVals() {
    const { SITES, DISTRICTS, DOCS } = this.data();
    const st = this.state;

    // C. Ecosystem
    const ECO = {
      learners: { kicker: 'Learners', title: 'They learn by building, together.', text: 'Students and early-career makers join free, learn from peers, and ship real projects at hackathons, study jams and the TinkerSpaces.', brings: 'Curiosity, time and projects — 52,775 registered members so far.', through: 'Campus communities, Tink-Her-Hack, Study Jams, the TinkerSpaces.' },
      mentors: { kicker: 'Mentors', title: 'They pass on what they know.', text: 'Industry professionals and alumni run sessions, review projects and guide learners — including week-long residencies in Kochi.', brings: 'Experience, feedback and links to industry.', through: 'Mentor in Residence, Study Jams, workshops at the TinkerSpaces.' },
      campuses: { kicker: 'Campuses', title: 'They put learning where students are.', text: 'Colleges host student-run TinkerHub communities and serve as venues for statewide programmes.', brings: 'Students, rooms and continuity — 72 active communities in 13 districts.', through: 'Campus communities and Tink-Her-Hack venues (67 in 2026).' },
      spaces: { kicker: 'TinkerSpaces', title: 'They give everyone a place to build.', text: 'Free, open community makerspaces in Kochi (since Dec 2022) and Calicut (since Aug 2026). No membership wall.', brings: 'Tools, space and a community, 24×7 in Kochi — 11,277 people since Apr 2024.', through: 'Workshops, hackathon nights, residencies and everyday tinkering.' },
      partners: { kicker: 'Partners', title: 'They make it possible.', text: 'Foundations, companies and public bodies fund programmes and spaces, contribute equipment, and hire from the community.', brings: 'Funding, infrastructure and opportunities — eight companies pledged ₹22L for Calicut’s first year.', through: 'Programme funding, in-kind support, hiring and co-hosting.' }
    };
    const ecoBase = 'width: 100%; display: flex; align-items: center; gap: 16px; text-align: left; font: inherit; color: #1F3D2B; cursor: pointer; border: 2px solid #1F3D2B; border-radius: 22px; padding: 8px 18px 8px 12px; min-height: 96px; transition: transform .15s; ';
    const eco = {};
    Object.keys(ECO).forEach((k) => {
      const on = st.eco === k;
      eco[k] = { pressed: on ? 'true' : 'false', style: ecoBase + (on ? 'background: #FBF4E6; box-shadow: 6px 6px 0 #1F3D2B; transform: translateX(6px)' : 'background: transparent'), pick: () => this.setState({ eco: k }) };
    });

    // D. Programmes
    const PROGS = [
      { id: 'kochi', group: 'now', name: 'TinkerSpace Kochi', glyph: '⌂', bg: '#F6C9D0', status: 'Open now', desc: 'A free, 24×7 community makerspace for anyone learning to build — hardware, software or a first product.', who: 'Students, developers, designers, anyone curious', where: 'HMT Kalamassery, Ernakulam', latest: '10,648 people since Apr 2024', url: 'https://tinkerhubfoundation.frappe.cloud/patron' },
      { id: 'calicut', group: 'now', name: 'TinkerSpace Calicut', glyph: '✶', bg: '#FFD15C', status: 'Open now', desc: 'Kerala’s second open makerspace, modelled on Kochi. Its first year is funded by eight companies and the community.', who: 'Makers in and around Kozhikode', where: 'Kozhikode', latest: 'Opened 15 Aug 2026 · 824 people so far', url: 'https://fundraiser.tinkerhub.org/' },
      { id: 'campus', group: 'now', name: 'Campus Communities', glyph: '◎', bg: '#BFE3C8', status: 'Active', desc: 'Student-run communities that bring peer learning, events and projects into colleges.', who: 'College students', where: '72 campuses, 13 districts', latest: 'Active list as of 20 Oct 2026', url: 'https://campus.tinkerhub.org/' },
      { id: 'thh', group: 'recurring', name: 'Tink-Her-Hack', glyph: '♀', bg: '#D9CCF2', status: 'Annual', desc: 'A women-only hackathon held across many venues at once, judged on learning rather than pitches.', who: 'Women students, any skill level', where: 'Statewide', latest: '4.0, Feb 2026: 67 venues, 2,413 teams', url: 'https://tinkerhubfoundation.frappe.cloud/tink-her-hack-2' },
      { id: 'jams', group: 'recurring', name: 'Study Jams', glyph: '{ }', bg: '#B9DDEB', status: 'Recurring', desc: 'Short, mentor-led sprints on one technology, followed by a weekend of building.', who: 'Learners who know basic programming', where: 'Online and on campus', latest: 'Ran as Tink-Her-Hack prep, Jan–Feb 2025', url: 'https://tinkerhubfoundation.frappe.cloud/studyjams' },
      { id: 'mir', group: 'open', name: 'Mentor in Residence', glyph: '☕', bg: '#FBF4E6', status: 'Open call', desc: 'Spend a week in Kochi, stay provided, and teach at TinkerSpace for at least three days.', who: 'Experienced professionals', where: 'Kochi', latest: 'Applications open on our website', url: 'https://tinkerhubfoundation.frappe.cloud/tinkerspace/mentor-in-residence' }
    ];
    const PT = [{ id: 'all', label: 'All' }, { id: 'now', label: 'Running now' }, { id: 'recurring', label: 'Recurring' }, { id: 'open', label: 'Open calls' }];
    const progTabs = PT.map((t) => ({ label: t.label, pressed: st.prog === t.id ? 'true' : 'false', style: this.chip(st.prog === t.id), pick: () => this.setState({ prog: t.id }) }));
    const progCards = PROGS.filter((p) => st.prog === 'all' || p.group === st.prog).map((p) => ({
      ...p,
      style: 'display: flex; flex-direction: column; gap: 14px; background: ' + p.bg + '; border: 2px solid #1F3D2B; border-radius: 28px; padding: 26px; box-sizing: border-box; min-height: 400px',
      statusStyle: 'font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border: 2px solid #1F3D2B; border-radius: 999px; padding: 3px 10px; background: #FBF4E6'
    }));

    // F. Places
    const pool = SITES.filter((s) => s.layer === 'campus' || s.layer === 'base');
    const used = DISTRICTS.filter((d) => pool.some((s) => s.district === d));
    const districts = DISTRICTS.map((d) => {
      const n = pool.filter((s) => s.district === d && s.layer === 'campus').length;
      const on = st.district === d;
      return { name: d, count: String(n), pressed: on ? 'true' : 'false', style: this.chip(on), countStyle: 'font-size: 12px; border-radius: 999px; padding: 1px 8px; ' + (on ? 'background: #FFD15C; color: #1F3D2B' : 'background: #F6C9D0'), pick: () => this.setState({ district: d }) };
    });
    const here = pool.filter((s) => s.district === st.district && (s.layer === 'campus' || s.name.indexOf('TinkerSpace') === 0));
    here.sort((a, b) => (a.layer === b.layer ? a.name.localeCompare(b.name) : a.layer === 'base' ? -1 : 1));
    const distSites = here.map((s) => ({
      name: s.name,
      dot: 'display: inline-block; width: 10px; height: 10px; flex-shrink: 0; ' + (s.layer === 'base' ? 'background: #FF7A3D; transform: rotate(45deg)' : 'background: #1F3D2B; border-radius: 50%'),
      note: s.layer === 'base' ? ' — ' + s.detail : '',
      noteStyle: 'color: #4E6357'
    }));
    const nCamp = here.filter((s) => s.layer === 'campus').length;
    const nSpace = here.length - nCamp;
    const distSummary = nCamp + (nCamp === 1 ? ' campus community' : ' campus communities') + (nSpace ? ' · ' + nSpace + (nSpace === 1 ? ' TinkerSpace' : ' TinkerSpaces') : '');
    const distEmpty = here.length ? [] : [{ text: 'No active campus community here yet — a college in this district could be the first.' }];

    // G. Partners
    const P = {
      gov: { label: 'Government', title: 'For government and public bodies', lead: 'A statewide network that can deliver skilling where students already are.', ways: ['Run skilling programmes through 72 campus communities across 13 districts.', 'Co-host multi-venue programmes — we ran Tink-Her-Hack 4.0 at 67 venues.', 'Set up an open community makerspace in your district, as we did in Kochi and Calicut.'], proof: 'We list a public body as a partner only with its approval.', cta: 'Start a conversation', url: 'mailto:mehar@tinkerhub.org?subject=Government%20collaboration', contact: 'Moosa Mehar MP, Co-founder & CEO · mehar@tinkerhub.org' },
      colleges: { label: 'Colleges', title: 'For colleges and universities', lead: 'Give your students a peer-learning community and a stage beyond the classroom.', ways: ['Start a student-run TinkerHub campus community.', 'Host a venue for the next Tink-Her-Hack.', 'Bring student teams to build at TinkerSpace Kochi or Calicut.'], proof: '72 colleges currently host an active community.', cta: 'Apply to host', url: 'https://forms.gle/LLfX9xFyKCRHejit6', contact: 'Kurian Jacob, COO · kurian@tinkerhub.org' },
      csr: { label: 'CSR & industry', title: 'For CSR teams and companies', lead: 'Fund visible, accountable programmes — and meet the talent they produce.', ways: ['Fund a programme, a district or a TinkerSpace’s year of running.', 'Contribute equipment or infrastructure in kind, as E2E Networks did with GPUs.', 'Hire from the community through HireHack.'], proof: 'CSR-1 registered (CSR00001705) · 80G certified · eight companies pledged ₹22L for Calicut’s first year.', cta: 'Request a proposal', url: 'mailto:mehar@tinkerhub.org?subject=CSR%20partnership', contact: 'mehar@tinkerhub.org' },
      mentors: { label: 'Mentors', title: 'For mentors and volunteers', lead: 'Share what you know with people eager to learn it.', ways: ['Spend a week as Mentor in Residence in Kochi, stay provided.', 'Run a session or workshop at a TinkerSpace.', 'Review projects at a hackathon near you.'], proof: 'Residencies run at TinkerSpace Kochi.', cta: 'Apply as a mentor', url: 'https://docs.google.com/forms/d/e/1FAIpQLSfkNekrC4TaJBo2xYkKQ1MU2msR1HeacILJ9FTaGRHWKQ6G_g/viewform', contact: 'hi@tinkerhub.org' },
      learners: { label: 'Learners', title: 'For learners', lead: 'Everything is free. Show up, learn with others, build something real.', ways: ['Join the community on TinkerHub’s platform.', 'Walk into TinkerSpace Kochi or Calicut.', 'Find the TinkerHub community on your campus.'], proof: '52,775 people have registered so far.', cta: 'Join TinkerHub', url: 'https://app.tinkerhub.org/', contact: 'hi@tinkerhub.org' }
    };
    const pTabs = Object.keys(P).map((k) => ({ label: P[k].label, pressed: st.ptab === k ? 'true' : 'false', style: this.chip(st.ptab === k), pick: () => this.setState({ ptab: k }) }));
    const sel = P[st.ptab];
    const pSel = { ...sel, ways: sel.ways.map((t) => ({ text: t })) };

    // H. Library
    const DC = [{ id: 'all', label: 'All' }, { id: 'reports', label: 'Impact reports' }, { id: 'financials', label: 'Money' }, { id: 'governance', label: 'Governance' }, { id: 'policies', label: 'Policies' }];
    const docTabs = DC.map((t) => ({ label: t.label, pressed: st.docCat === t.id ? 'true' : 'false', style: this.chip(st.docCat === t.id), pick: () => this.setState({ docCat: t.id }) }));
    const docs = DOCS.filter((d) => st.docCat === 'all' || d.cat === st.docCat);

    return {
      eco, ecoSel: ECO[st.eco],
      progTabs, progCards,
      districts, distTitle: st.district, distSummary, distSites, distEmpty,
      pTabs, pSel, docTabs, docs
    };
  }
}

window.__mount(Component);
</script>
